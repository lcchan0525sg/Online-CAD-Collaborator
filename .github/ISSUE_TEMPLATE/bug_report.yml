name: Bug report
description: Report a reproducible problem in CAD Viewer
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not report security issues here; follow SECURITY.md instead."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the viewer with...
        2. Load...
        3. Select...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: CAD Viewer version or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, browser, Node version, and CAD backend details if conversion is involved.
    validations:
      required: true
