<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OBJ Inspector</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    margin: 0; min-height: 100vh; display: flex; justify-content: center; padding: 32px 16px;
    background: linear-gradient(180deg, #f4f6fb, #e9edf5);
    color: #1c2333;
  }
  @media (prefers-color-scheme: dark) {
    body { background: linear-gradient(180deg, #181b24, #10131a); color: #e6e9f0; }
  }
  .card {
    width: 100%; max-width: 720px; background: #fff; border-radius: 16px;
    box-shadow: 0 10px 40px rgba(20,30,60,.12); padding: 28px;
  }
  @media (prefers-color-scheme: dark) { .card { background: #1c2029; box-shadow: 0 10px 40px rgba(0,0,0,.5); } }
  h1 { margin: 0 0 4px; font-size: 22px; }
  .sub { margin: 0 0 20px; opacity: .65; font-size: 13px; }
  .drop {
    border: 2px dashed #aab2c4; border-radius: 12px; padding: 34px 16px; text-align: center;
    color: #6a7387; cursor: pointer; transition: all .15s; font-size: 15px;
  }
  .drop:hover, .drop.over { border-color: #4a7dff; background: #f0f5ff; color: #2a4dbd; }
  @media (prefers-color-scheme: dark) { .drop { border-color: #3a4152; color: #8a93a8; } .drop:hover, .drop.over { border-color: #6d9bff; background: #1a2233; color: #9cc0ff; } }
  .drop .big { font-size: 17px; font-weight: 600; }
  .row { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  .btn {
    border: 1px solid #aab2c4; background: #f7f9fc; color: #1c2333; border-radius: 8px;
    padding: 8px 14px; font-size: 14px; cursor: pointer;
  }
  .btn:hover { border-color: #4a7dff; }
  @media (prefers-color-scheme: dark) { .btn { background: #262b36; color: #e6e9f0; border-color: #3a4152; } .btn:hover { border-color: #6d9bff; } }
  #file { display: none; }
  .summary { margin-top: 18px; font-size: 15px; }
  .summary .verdict { font-weight: 600; }
  .ok { color: #1c9d4f; }
  .warn { color: #d9862a; }
  .bad { color: #d9384a; }
  h3 { margin: 22px 0 8px; font-size: 14px; text-transform: uppercase; letter-spacing: .06em; opacity: .7; }
  ul { margin: 0; padding-left: 22px; }
  li { margin: 3px 0; font-size: 14px; }
  .chip {
    display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600;
    background: #eef1f7; color: #48536b; margin: 2px 4px 2px 0;
  }
  @media (prefers-color-scheme: dark) { .chip { background: #2c3240; color: #b9c2d6; } }
  .swatch { display: inline-block; width: 13px; height: 13px; border-radius: 3px; vertical-align: -1px; margin-right: 6px; border: 1px solid rgba(0,0,0,.25); }
  .empty { opacity: .5; font-style: italic; }
  .meta { font-size: 13px; opacity: .6; margin-top: 16px; }
  .mono { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; }
</style>
</head>
<body>
<div class="card">
  <h1>OBJ Inspector</h1>
  <p class="sub">Check what part/group names and colours a Wavefront <span class="mono">.obj</span> contains — before opening it in the CAD viewer. Runs entirely in your browser; nothing is uploaded.</p>

  <div class="drop" id="drop">
    <div class="big">Drop an <span class="mono">.obj</span> here</div>
    <div>or click to browse</div>
  </div>
  <input type="file" id="file" accept=".obj">

  <div class="row">
    <button class="btn" id="openBtn">Open .obj file…</button>
    <button class="btn" id="openMtlBtn" disabled>Add .mtl (optional, for colours)</button>
  </div>

  <div class="summary" id="summary"></div>
</div>

<script>
"use strict";
const drop = document.getElementById('drop');
const fileInput = document.getElementById('file');
const openBtn = document.getElementById('openBtn');
const openMtlBtn = document.getElementById('openMtlBtn');
const summary = document.getElementById('summary');

let objName = null;
let mtlText = null;   // contents of a .mtl, if the user also provided one
let mtlName = null;

function esc(s){ return (s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function chip(t){ return '<span class="chip">'+esc(t)+'</span>'; }
function swatch(rgb){ return '<span class="swatch" style="background:rgb('+rgb+')"></span>'; }

function hexToRgb(hex){
  const m = /^#?([0-9a-f]{6})$/i.exec((hex||'').trim());
  if(!m) return null;
  const n = parseInt(m[1],16);
  return [ (n>>16)&255, (n>>8)&255, n&255 ];
}
function hexString(rgb){ return '#' + rgb.map(c=>c.toString(16).padStart(2,'0')).join(''); }

// --- mtl parsing: returns map materialName -> {name, rgb[3] or null, maps[]} ---
function parseMtl(text){
  const mats = {}; let cur = null;
  for (const raw of String(text||'').split(/\r?\n/)){
    const line = raw.trim(); if(!line || line.startsWith('#')) continue;
    const parts = line.split(/\s+/); const k = parts[0];
    if (k === 'newmtl'){ cur = parts[1]; mats[cur] = { name: cur, rgb: null, maps: [] }; }
    else if (k === 'Kd' && cur){ const [r,g,b] = parts.slice(1).map(Number);
      if([r,g,b].every(x => Number.isFinite(x) && x>=0)) mats[cur].rgb = [Math.round(r*255), Math.round(g*255), Math.round(b*255)]; }
    else if (/^map_/i.test(k) && cur && parts[1]){ mats[cur].maps.push(parts[1]); }
  }
  return mats;
}

function render(){
  // objText / mtlText / mtlName set by loadObj / loadMtl
  const lines = (objText||'').split(/\r?\n/);
  const objs = [], groups = [], mtllibs = [], usemtls = [];
  let verts = 0, faces = 0, vt = 0;
  for (const raw of lines){
    const line = raw.trim(); if(!line) continue;
    const c = line[0];
    if (c === 'o') objs.push(line.slice(1).trim());
    else if (c === 'g') groups.push(line.slice(1).trim());
    else if (line.startsWith('mtllib')) mtllibs.push(line.slice(7).trim());
    else if (line.startsWith('usemtl')) usemtls.push(line.slice(7).trim());
    else if (c === 'v' && line[1] === ' ') verts++;
    else if (c === 'v' && line[1] === 't') vt++;
    else if (c === 'f') faces++;
  }
  // unique, in order
  const uniq = a => a.filter((x,i)=>a.indexOf(x)===i);

  const objsU = uniq(objs), groupsU = uniq(groups), usemtlsU = uniq(usemtls), mtllibsU = uniq(mtllibs);

  const mats = parseMtl(mtlText);

  // Does the obj reference a mtllib but we have no mtl?
  let verdict, cls;
  let html = '<h3>Part names</h3>';
  if (objsU.length){
    html += '<ul>'+objsU.map((o,i)=>'<li>'+(i+1)+'. <b>'+esc(o)+'</b> <span class="mono">(o)</span></li>').join('')+'</ul>';
    html += '<p style="font-size:13px;opacity:.7">The CAD viewer uses these <b>object names</b> as part names.</p>';
    verdict = 'Part names from <b>o</b> object lines: ' + objsU.map(esc).join(', ');
    cls = 'ok';
  } else if (groupsU.length){
    html += '<ul>'+groupsU.map((g,i)=>'<li>'+(i+1)+'. <b>'+esc(g)+'</b> <span class="mono">(g)</span></li>').join('')+'</ul>';
    html += '<p style="font-size:13px;opacity:.7">No <b>o</b> object lines. The viewer falls back to group (<b>g</b>) / sequential names.</p>';
    verdict = 'No <b>o</b> names — parts named from <b>g</b> groups or <b>Part1, Part2…</b>';
    cls = 'warn';
  } else {
    html += '<p class="empty">No object or group names — parts will be <b>Part1, Part2…</b></p>';
    verdict = 'No <b>o</b> / <b>g</b> names — parts will be sequential <b>Part1, Part2…</b>';
    cls = 'warn';
  }

  html += '<h3>Materials ('+usemtlsU.length+')</h3>';
  if (usemtlsU.length){
    html += '<ul>' + usemtlsU.map(m => {
      const mat = mats[m];
      let cell = '';
      if (mat && mat.rgb) cell = ' ' + swatch(mat.rgb) + hexString(mat.rgb) + ' <span class="mono">(Kd)</span>';
      if (mat && mat.maps.length) cell += ' ' + mat.maps.map(mp => chip('map '+mp)).join(' ');
      return '<li><b>'+esc(m)+'</b>'+cell+'</li>';
    }).join('') + '</ul>';
  } else html += '<p class="empty">No <span class="mono">usemtl</span> materials.</p>';

  html += '<h3>Material library</h3>';
  if (mtllibsU.length) html += '<ul>'+mtllibsU.map(x=>'<li class="mono">'+esc(x)+'</li>').join('')+'</ul>';
  else html += '<p class="empty">No <span class="mono">mtllib</span> reference.</p>';

  // colour / mtl status
  const needMtl = mtllibsU.length > 0;
  if (!needMtl){
    html += '<p class="verdict '+cls+'">Colours: no <span class="mono">mtllib</span> — no separate material file involved.</p>';
  } else if (mtlText != null){
    const found = usemtlsU.filter(m => mats[m] && mats[m].rgb);
    html += '<p class="verdict '+cls+'">Colours: <b>'+mtlName+'</b> loaded — '
      + (found.length ? found.length+' material(s) have colours.' : 'materials found but none with a Kd colour.')
      + '</p>';
    // warn about textures
    const anyMap = Object.values(mats).some(m => m.maps.length);
    if (anyMap) html += '<p class="warn" style="margin-top:6px">⚠ This mtl references texture maps (<span class="mono">map_*</span>) — the current viewer shows colours only, not textures.</p>';
  } else {
    html += '<p class="verdict bad">⚠ Colours: needs <b>'+esc(mtllibsU[0])+'</b> — add it with “Add .mtl” to see part colours. (The CAD viewer needs the .mtl opened together with the .obj.)</p>';
  }

  html += '<p class="verdict '+cls+'" style="margin-top:14px">'+verdict+'</p>';
  html += '<p class="meta">'+esc(objName)+' — '+verts.toLocaleString()+' verts, '+faces.toLocaleString()+' faces'
    + (vt ? ', '+vt.toLocaleString()+' UVs' : '') + '</p>';

  summary.innerHTML = html;
}

// file reading
function readFile(f){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(r.error); r.readAsText(f); }); }

let objText = null;
function loadObj(file){
  if(!file) return;
  objName = file.name; objText = null;
  readFile(file).then(t => { objText = t; render(); }).catch(e => summary.innerHTML = '<p class="bad">Error reading file: '+esc(e.message)+'</p>');
}
function loadMtl(file){
  if(!file) return;
  readFile(file).then(t => { mtlText = t; mtlName = file.name; render(); }).catch(e=>summary.innerHTML='<p class="bad">'+esc(e.message)+'</p>');
}

drop.addEventListener('click', () => fileInput.click());
openBtn.addEventListener('click', () => { fileInput.accept='.obj'; fileInput.multiple=false; fileInput.click(); });
openMtlBtn.addEventListener('click', () => { fileInput.accept='.mtl'; fileInput.multiple=false; fileInput.click(); });

fileInput.addEventListener('change', (e) => {
  const f = e.target.files && e.target.files[0];
  if (/.\.mtl$/i.test(f.name)) loadMtl(f); else loadObj(f);
  e.target.value = '';
});

drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
drop.addEventListener('dragleave', () => drop.classList.remove('over'));
drop.addEventListener('drop', e => {
  e.preventDefault(); drop.classList.remove('over');
  const f = e.dataTransfer.files && e.dataTransfer.files[0];
  if (!f) return;
  if (/.\.mtl$/i.test(f.name)){ loadMtl(f); openMtlBtn.disabled=false; }
  else { loadObj(f); openMtlBtn.disabled = false; }
});
</script>
</body>
</html>
